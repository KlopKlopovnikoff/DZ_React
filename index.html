<html lang="en"><head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="https://mdn.github.io/todo-react/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoMatic</title>
    <script type="module" crossorigin="" src="/src/main.jsx"></script>
    <link rel="stylesheet" crossorigin="" href="/src/index.css">
  </head>
  <body>
    <div id="root">
		<div class="todoapp stack-large"><h1>Todo-List</h1>
		<form>
			<h2 class="label-wrapper">
			<label for="new-todo-input" class="label__lg">Что нужно делать?</label>
		</h2>
			<input type="text" id="new-todo-input" class="input input__lg" name="text" autocomplete="off" value="">
		<button type="submit" class="btn btn__primary btn__lg">Добавить</button>
		</form><div class="filters btn-group stack-exception">
		<button type="button" class="btn toggle-btn" aria-pressed="true">
		<span class="visually-hidden">Показать </span><span>All</span>
		<span class="visually-hidden"> Задачи</span></button>
		<button type="button" class="btn toggle-btn" aria-pressed="false">
		<span class="visually-hidden">Показать </span><span>Active</span>
		<span class="visually-hidden"> Задачи</span>
		</button>
		<button type="button" class="btn toggle-btn" aria-pressed="false">
		<span class="visually-hidden">Показать </span>
		<span>Завершенные</span>
		<span class="visually-hidden"> Задачи</span>
		</button>
		</div>
		<h2 id="list-heading" tabindex="-1">3 Оставшиеся задачи</h2>
		<ul aria-labelledby="list-heading" class="todo-list stack-large stack-exception" role="list">
		<li class="todo"><div class="stack-small">
		<div class="c-cb"><input id="todo-0" type="checkbox" checked="">
		<label class="todo-label" for="todo-0">Проверить Домашки</label>
		</div><div class="btn-group">
		<button type="button" class="btn">Редактировать <span class="visually-hidden">Проверить Домашки</span>
		</button>
		<button type="button" class="btn btn__danger">Удалить <span class="visually-hidden">Проверить Домашки</span>
		</button>
		</div>
		</div>
		</li>
		<li class="todo">
		<div class="stack-small">
		<div class="c-cb">
		<input id="todo-1" type="checkbox">
		<label class="todo-label" for="todo-1">Поставить 4</label>
		</div><div class="btn-group">
		<button type="button" class="btn">Редактировать <span class="visually-hidden">Поставить 4</span>
		</button>
		<button type="button" class="btn btn__danger">Удалить <span class="visually-hidden"> Поставить 4</span>
		</button>
		</div>
		</div>
		</li>
		<li class="todo">
		<div class="stack-small">
		<div class="c-cb">
		<input id="todo-2" type="checkbox">
		<label class="todo-label" for="todo-2">Поставить 5</label>
		</div>
		<div class="btn-group">
		<button type="button" class="btn">Редактировать <span class="visually-hidden">Поставить 5</span>
		</button>
		<button type="button" class="btn btn__danger">Удалить <span class="visually-hidden">Поставить 5</span>
		</button>
		</div>
		</div>
		</li>
		</ul>
		</div>
	</div>
  

</body></html>
